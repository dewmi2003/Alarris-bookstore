<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alariis Bookstore - Your premier destination for books">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Alariis Bookstore</title>
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                }
            } catch (e) {
                // no-op: fallback to default theme
            }
        })();
    </script>

    
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    <link rel="stylesheet" th:href="@{/css/global-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/premium-home.css}">
    

    <th:block layout:fragment="extra-css"></th:block>
</head>

<body class="page-wrapper">

    <div class="scroll-progress" id="scrollProgress"></div>


    <div th:replace="~{fragments/header :: nav}"></div>


    <main layout:fragment="content" class="main-content">
        
        <div class="container mt-2">
            <div th:if="${successMessage}" class="alert alert-success scroll-animate">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMessage}">Success!</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-error scroll-animate">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMessage}">Error!</span>
            </div>
        </div>
        
    </main>

    
    <div sec:authorize="!hasRole('ADMIN')" th:replace="~{fragments/footer :: footer}"></div>

    
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    
    <div class="toast-container" id="toastContainer"></div>

    
    <script th:src="@{/js/design-system.js}"></script>
    <script th:src="@{/js/premium-home.js}"></script>

    
    <th:block layout:fragment="extra-js"></th:block>
</body>

</html>
