<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}">Book Form</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="container mt-4" style="max-width: 800px;">
            <div class="mb-4">
                <a th:href="@{/admin/books}" class="text-secondary"><i class="fas fa-arrow-left"></i> Back to Books</a>
                <h1 th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}" class="mt-2">Book Form</h1>
            </div>

            <div class="card">
                <form th:action="@{${book.id == null ? '/admin/books' : '/admin/books/' + book.id}}" th:object="${book}"
                    method="post" enctype="multipart/form-data">

                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{coverImage}">

                    <div class="grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group">
                            <label for="title">Book Title</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control"
                                placeholder="e.g. The Great Gatsby" required>
                        </div>

                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" th:field="*{author}" class="form-control"
                                placeholder="e.g. F. Scott Fitzgerald" required>
                        </div>
                    </div>

                    <div class="grid mt-2" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group">
                            <label for="isbn">ISBN</label>
                            <input type="text" id="isbn" th:field="*{isbn}" class="form-control"
                                placeholder="978-XXXXXXXXXX" required>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" th:field="*{category}" class="form-control" required>
                                <option value="" disabled selected>Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
                                    Category</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group mt-2">
                        <label for="price">Price (LKR)</label>
                        <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required>
                    </div>

                    <div class="form-group mt-2">
                        <label for="description">Book Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="6"
                            placeholder="Write a short summary of the book..."></textarea>
                    </div>

                    <div class="form-group mt-2">
                        <label for="image">Cover Image</label>
                        <div class="flex items-center gap-2">
                            <input type="file" id="image" name="image" class="form-control"
                                accept="image/png, image/jpeg">
                            <div th:if="${book.coverImage != null}" class="text-secondary text-sm">
                                <i class="fas fa-file-image"></i> Current: <span th:text="${book.coverImage}"></span>
                            </div>
                        </div>
                        <p class="form-text">Accepted formats: PNG, JPG. Max size 2MB.</p>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" style="flex: 2;">
                            <i class="fas fa-save"></i> Save Book
                        </button>
                        <a th:href="@{/admin/books}" class="btn btn-accent" style="flex: 1;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
