<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Edit Order - Admin</title>
</head>

<body>
    <main layout:fragment="content" class="admin-manage-page">
        <div class="container mt-4">
            <div class="mb-4">
                <h1>Edit Order #<span th:text="${order.id}">1</span></h1>
                <p class="text-secondary">Update status, tracking number, and shipping details.</p>
            </div>

            <form th:action="@{'/admin/orders/update/' + ${order.id}}" method="post" class="card"
                style="max-width: 700px;">
                <div class="form-group">
                    <label for="status">Order Status</label>
                    <select id="status" name="status" class="form-control">
                        <option value="PENDING" th:selected="${order.status == 'PENDING'}">PENDING</option>
                        <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">SHIPPED</option>
                        <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">DELIVERED</option>
                        <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">CANCELLED</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="trackingNumber">Tracking Number</label>
                    <input type="text" id="trackingNumber" name="trackingNumber" th:value="${order.trackingNumber}"
                        class="form-control">
                </div>

                <div class="form-group">
                    <label for="shippingCompany">Shipping Company</label>
                    <input type="text" id="shippingCompany" name="shippingCompany" th:value="${order.shippingCompany}"
                        class="form-control">
                </div>

                <div class="form-group">
                    <label>Estimated Delivery Date</label>
                    <input type="text" th:value="${#temporals.format(order.estimatedDeliveryDate, 'dd-MM-yyyy')}"
                        class="form-control" readonly>
                </div>

                <div class="flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Update Order</button>
                    <a th:href="@{/admin/orders}" class="btn btn-accent">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
