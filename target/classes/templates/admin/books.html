<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Manage Books</title>
</head>

<body>
    <main layout:fragment="content" class="admin-manage-page">
        <div class="container mt-4">
            <div class="flex justify-between items-center mb-4">
                <h1>Manage Books</h1>
                <a th:href="@{/admin/books/new}" class="btn btn-accent">
                    <i class="fas fa-plus"></i> Add New Book
                </a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cover</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Featured</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}">1</td>
                        <td>
                            <img th:if="${book.coverImage != null}" th:src="@{'/images/books/' + ${book.coverImage}}"
                                class="rounded-sm" style="height: 60px; width: 45px; object-fit: cover;">
                            <div th:if="${book.coverImage == null}"
                                class="flex items-center justify-center bg-gray rounded-sm"
                                style="height: 60px; width: 45px;">
                                <i class="fas fa-book text-light"></i>
                            </div>
                        </td>
                        <td th:text="${book.title}" style="font-weight: 600;">Book Title</td>
                        <td th:text="${book.author}">Author Name</td>
                        <td th:text="'LKR ' + ${book.price}" class="text-accent" style="font-weight: 700;">LKR 0.00</td>
                        <td th:text="${book.category != null ? book.category.name : '-'}">Category</td>
                        <td>
                            <a th:href="@{'/admin/books/toggle-feature/' + ${book.id}}"
                                th:class="${book.featured} ? 'badge badge-success' : 'badge badge-secondary'"
                                th:text="${book.featured} ? 'Yes' : 'No'" style="text-decoration: none;">
                                No
                            </a>
                        </td>
                        <td>
                            <div class="flex gap-1">
                                <a th:href="@{'/admin/books/edit/' + ${book.id}}" class="btn btn-primary"
                                    style="padding: 0.5rem; font-size: 0.8rem;">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{'/admin/books/delete/' + ${book.id}}" class="btn btn-accent"
                                    onclick="return confirm('Are you sure you want to delete this book?');"
                                    style="padding: 0.5rem; font-size: 0.8rem;">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
