<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${category.id == null ? 'Add Category' : 'Edit Category'}">Category Form</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="container mt-4" style="max-width: 600px;">
            <div class="mb-4">
                <a th:href="@{/admin/categories}" class="text-secondary"><i class="fas fa-arrow-left"></i> Back to
                    Categories</a>
                <h1 th:text="${category.id == null ? 'Add New Category' : 'Edit Category'}" class="mt-2">Category Form
                </h1>
            </div>

            <div class="card">
                <form th:action="@{/admin/categories}" th:object="${category}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="form-group">
                        <label for="name">Category Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                            placeholder="e.g. Science Fiction" required>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" style="flex: 2;">
                            <i class="fas fa-save"></i> Save Category
                        </button>
                        <a th:href="@{/admin/categories}" class="btn btn-accent" style="flex: 1;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
