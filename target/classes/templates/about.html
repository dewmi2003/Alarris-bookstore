<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>About Us - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            .about-shell {
                max-width: 1180px;
                margin: var(--space-6) auto var(--space-10);
            }

            .about-hero {
                border-radius: 30px;
                padding: clamp(1.75rem, 3vw, 2.8rem);
                background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.28), transparent 45%),
                    linear-gradient(125deg, rgba(79, 70, 229, 0.95), rgba(67, 56, 202, 0.92));
                color: #fff;
                margin-bottom: 1.5rem;
            }

            [data-theme="dark"] .about-hero {
                background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.2), transparent 45%),
                    linear-gradient(125deg, rgba(15, 23, 42, 0.94), rgba(30, 64, 175, 0.86));
            }

            .about-grid {
                display: grid;
                grid-template-columns: 1.15fr 0.85fr;
                gap: 1rem;
            }

            .about-card {
                background: color-mix(in srgb, var(--bg-white) 92%, transparent);
                border: 1px solid rgba(99, 102, 241, 0.16);
                border-radius: 24px;
                box-shadow: 0 16px 35px rgba(15, 23, 42, 0.08);
                padding: 1.3rem;
            }

            .metric-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0.6rem;
            }

            .metric {
                border-radius: 14px;
                padding: 0.9rem;
                background: rgba(99, 102, 241, 0.08);
                text-align: center;
            }

            .metric strong {
                display: block;
                font-size: 1.25rem;
                color: var(--primary-indigo);
            }

            @media (max-width: 980px) {
                .about-grid {
                    grid-template-columns: 1fr;
                }

                .metric-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <div class="container about-shell">
            <section class="about-hero">
                <h1 th:text="${aboutContent.title}">About Alariis</h1>
                <p th:text="${aboutContent.subtitle}">We are a modern bookstore helping readers discover books they actually finish.</p>
            </section>

            <section class="about-grid">
                <article class="about-card">
                    <h2 class="mb-3">Our Story</h2>
                    <p class="mb-4" style="line-height: 1.85;" th:text="${aboutContent.content}">Our story.</p>

                    <h3 class="mb-2">Why Readers Choose Us</h3>
                    <p style="line-height: 1.8;" th:text="${aboutContent.extraContent}">Reasons.</p>
                </article>

                <aside class="about-card">
                    <h2 class="mb-3">Impact Snapshot</h2>
                    <div class="metric-grid mb-4">
                        <div class="metric">
                            <strong>50K+</strong>
                            <span>Books</span>
                        </div>
                        <div class="metric">
                            <strong>10K+</strong>
                            <span>Readers</span>
                        </div>
                        <div class="metric">
                            <strong>99%</strong>
                            <span>Secure Orders</span>
                        </div>
                    </div>
                    <a th:href="${aboutContent.ctaUrl != null && !aboutContent.ctaUrl.isBlank() ? aboutContent.ctaUrl : '/books?category=fiction'}"
                        class="btn btn-primary w-full" style="width: 100%;">
                        <i class="fas fa-book-open"></i>
                        <span th:text="${aboutContent.ctaText != null && !aboutContent.ctaText.isBlank() ? aboutContent.ctaText : 'Browse Fiction'}">Browse Fiction</span>
                    </a>
                </aside>
            </section>
        </div>
    </main>
</body>

</html>
