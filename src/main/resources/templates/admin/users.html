<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Manage Users</title>
</head>

<body>
    <main layout:fragment="content" class="admin-manage-page">
        <div class="container mt-4">
            <div class="mb-4">
                <h1>Manage Users</h1>
                <p class="text-secondary">View and manage registered customers and administrators.</p>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Registered Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.fullName}" style="font-weight: 600;">John Doe</td>
                        <td th:text="${user.email}">john@example.com</td>
                        <td>
                            <span th:each="role : ${user.roles}" th:text="${role.name}"
                                th:class="${role.name == 'ROLE_ADMIN'} ? 'badge badge-error' : 'badge badge-info'"
                                style="margin-right: 0.2rem;">
                                ROLE
                            </span>
                        </td>
                        <td
                            th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}">
                            Date</td>
                        <td>
                            <div class="flex gap-1">
                                <form th:if="${#authentication.name != user.email}"
                                    th:action="@{'/admin/users/reset-password/' + ${user.id}}" method="post"
                                    style="margin: 0;">
                                    <button type="submit" class="btn btn-primary"
                                        onclick="return confirm('Reset this user password to Password@123 ?');"
                                        style="padding: 0.5rem; font-size: 0.8rem;">
                                        <i class="fas fa-key"></i> Reset Password
                                    </button>
                                </form>
                                <a th:if="${#authentication.name != user.email}"
                                    th:href="@{'/admin/users/delete/' + ${user.id}}" class="btn btn-accent"
                                    onclick="return confirm('Are you sure you want to delete this user?');"
                                    style="padding: 0.5rem; font-size: 0.8rem;">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </a>
                            </div>
                            <span th:if="${#authentication.name == user.email}" class="badge badge-secondary">Current
                                User</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
