<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>My Orders - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            .orders-shell {
                max-width: 1080px;
                margin: var(--space-6) auto var(--space-10);
            }

            .orders-head {
                padding: 1.2rem 1.3rem;
                border-radius: 24px;
                background: linear-gradient(135deg, rgba(79, 70, 229, 0.92), rgba(14, 165, 233, 0.84));
                color: #fff;
                margin-bottom: 1rem;
            }

            .order-card-pro {
                background: color-mix(in srgb, var(--bg-white) 90%, transparent);
                border: 1px solid rgba(99, 102, 241, 0.18);
                border-radius: 24px;
                padding: 1.1rem;
                margin-bottom: 0.9rem;
                box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
            }

            .order-top {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 0.8rem;
                padding-bottom: 0.85rem;
                border-bottom: 1px dashed rgba(99, 102, 241, 0.28);
            }

            .status-chip {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0.28rem 0.7rem;
                border-radius: 999px;
                font-size: 0.72rem;
                font-weight: 800;
                text-transform: uppercase;
            }

            .items-wrap {
                margin: 0.8rem 0;
                display: grid;
                gap: 0.45rem;
            }

            .item-row {
                display: flex;
                justify-content: space-between;
                gap: 0.7rem;
                align-items: center;
                padding: 0.6rem 0.7rem;
                border-radius: 12px;
                background: rgba(99, 102, 241, 0.06);
            }

            .order-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.55rem;
            }

            .order-actions .btn {
                border-radius: 999px;
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <div class="container orders-shell">
            <header class="orders-head">
                <h1 class="mb-1"><i class="fas fa-box"></i> My Orders</h1>
                <p>Track, review, and manage your purchases in one place.</p>
            </header>

            <div th:if="${#lists.isEmpty(orders)}" class="card text-center py-10">
                <i class="fas fa-book-open fa-4x text-light mb-4"></i>
                <h2>No orders yet</h2>
                <p class="text-secondary mb-5">Start with our most popular fiction titles.</p>
                <a th:href="@{/books(category='fiction')}" class="btn btn-primary btn-lg">Browse Books</a>
            </div>

            <div th:unless="${#lists.isEmpty(orders)}">
                <article class="order-card-pro" th:each="order : ${orders}">
                    <div class="order-top">
                        <div>
                            <span class="text-xs text-tertiary uppercase font-bold">Order</span>
                            <h3 class="text-xl mb-1" th:text="'#' + ${order.id}">#00</h3>
                            <p class="text-sm text-secondary" th:text="${#temporals.format(order.orderDate, 'MMMM dd, yyyy HH:mm')}">Date</p>
                        </div>
                        <div class="text-right">
                            <span th:text="${order.status}"
                                th:class="'status-chip ' + (${order.status == 'PENDING' ? 'bg-warning-light text-warning' : (order.status == 'COMPLETED' || order.status == 'DELIVERED' ? 'bg-success-light text-success' : 'bg-error-light text-error')})">STATUS</span>
                            <div class="text-2xl font-black text-indigo mt-2"
                                th:text="'LKR ' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">LKR 0.00</div>
                        </div>
                    </div>

                    <div class="items-wrap">
                        <div class="item-row" th:each="item : ${order.items}">
                            <div>
                                <strong th:text="${item.book.title}">Book</strong>
                                <p class="text-xs text-secondary" th:text="${item.book.author}">Author</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-tertiary" th:text="'Qty: ' + ${item.quantity}">Qty</span>
                                <div class="font-bold text-indigo"
                                    th:text="'LKR ' + ${#numbers.formatDecimal(item.price * item.quantity, 1, 2)}">LKR 0.00</div>
                            </div>
                        </div>
                    </div>

                    <div class="order-actions">
                        <a th:href="@{'/order/confirmation/' + ${order.id}}" class="btn btn-sm btn-outline">
                            <i class="fas fa-circle-info"></i> View Details
                        </a>
                        <a th:href="@{'/order/confirmation/' + ${order.id} + '/pdf'}" class="btn btn-sm btn-ghost text-indigo">
                            <i class="fas fa-file-pdf"></i> Invoice
                        </a>
                        <form th:if="${order.status == 'PENDING'}" th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post" style="margin-left: auto;">
                            <button type="submit" class="btn btn-sm btn-ghost text-error"
                                onclick="return confirm('Cancel this order?')">
                                <i class="fas fa-times-circle"></i> Cancel
                            </button>
                        </form>
                    </div>
                </article>
            </div>
        </div>
    </main>
</body>

</html>
