<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Shopping Cart - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            .cart-shell {
                max-width: 1180px;
                margin: var(--space-6) auto var(--space-10);
            }

            .cart-head {
                border-radius: 24px;
                padding: 1.2rem 1.3rem;
                color: #fff;
                background: linear-gradient(135deg, rgba(79, 70, 229, 0.95), rgba(45, 212, 191, 0.78));
                margin-bottom: 1rem;
            }

            .cart-grid {
                display: grid;
                grid-template-columns: 1.15fr 0.85fr;
                gap: 0.95rem;
                align-items: flex-start;
            }

            .cart-item {
                background: color-mix(in srgb, var(--bg-white) 90%, transparent);
                border: 1px solid rgba(99, 102, 241, 0.18);
                border-radius: 20px;
                padding: 0.85rem;
                margin-bottom: 0.65rem;
                display: flex;
                gap: 0.85rem;
                box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
            }

            .cart-img {
                width: 88px;
                height: 120px;
                border-radius: 12px;
                object-fit: cover;
            }

            .qty-shell {
                display: inline-flex;
                align-items: center;
                gap: 0.2rem;
                background: rgba(99, 102, 241, 0.08);
                border-radius: 999px;
                padding: 0.2rem;
            }

            .qty-shell button {
                width: 28px;
                height: 28px;
                border-radius: 50%;
            }

            .summary {
                background: color-mix(in srgb, var(--bg-white) 90%, transparent);
                border: 1px solid rgba(99, 102, 241, 0.18);
                border-radius: 20px;
                padding: 1rem;
                box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
                position: sticky;
                top: 102px;
            }

            @media (max-width: 992px) {
                .cart-grid {
                    grid-template-columns: 1fr;
                }

                .summary {
                    position: static;
                }
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <div class="container cart-shell">
            <header class="cart-head">
                <h1 class="mb-1"><i class="fas fa-shopping-cart"></i> Your Cart</h1>
                <p>Review items before checkout.</p>
            </header>

            <div th:if="${#lists.isEmpty(cartItems)}" class="card text-center py-10">
                <i class="fas fa-cart-arrow-down fa-4x text-light mb-4"></i>
                <h2>Your cart is empty</h2>
                <p class="text-secondary mb-5">Start with fiction books and build your order.</p>
                <a th:href="@{/books(category='fiction')}" class="btn btn-primary btn-lg">Browse Books</a>
            </div>

            <div th:unless="${#lists.isEmpty(cartItems)}" class="cart-grid">
                <section>
                    <article class="cart-item" th:each="item : ${cartItems}">
                        <img th:if="${item.book.coverImage != null}" th:src="@{'/images/books/' + ${item.book.coverImage}}" class="cart-img" alt="Book cover">
                        <div th:if="${item.book.coverImage == null}" class="cart-img flex items-center justify-center bg-gray">
                            <i class="fas fa-book text-light"></i>
                        </div>

                        <div class="flex-grow">
                            <h3 class="mb-1" th:text="${item.book.title}">Book Title</h3>
                            <p class="text-sm text-secondary mb-3" th:text="${item.book.author}">Author</p>

                            <div class="flex justify-between items-end gap-4">
                                <div>
                                    <form th:action="@{/cart/update}" method="post" class="qty-shell mb-2">
                                        <input type="hidden" name="bookId" th:value="${item.book.id}">
                                        <button type="submit" class="btn btn-sm btn-ghost p-1" name="quantity" th:value="${item.quantity - 1}" th:disabled="${item.quantity <= 1}">
                                            <i class="fas fa-minus text-xs"></i>
                                        </button>
                                        <input type="number" readonly th:value="${item.quantity}" class="font-bold text-center" style="width: 36px; border: none; background: transparent;">
                                        <button type="submit" class="btn btn-sm btn-ghost p-1" name="quantity" th:value="${item.quantity + 1}">
                                            <i class="fas fa-plus text-xs"></i>
                                        </button>
                                    </form>
                                    <a th:href="@{'/cart/remove/' + ${item.book.id}}" class="text-error text-sm hover:underline"
                                        onclick="return confirm('Remove this item from cart?')">
                                        <i class="fas fa-trash"></i> Remove
                                    </a>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-tertiary" th:text="'LKR ' + ${item.book.price} + ' each'">LKR 0.00 each</div>
                                    <div class="text-xl font-black text-indigo" th:text="'LKR ' + ${#numbers.formatDecimal(item.totalPrice, 1, 2)}">LKR 0.00</div>
                                </div>
                            </div>
                        </div>
                    </article>
                </section>

                <aside class="summary">
                    <h3 class="mb-3">Order Summary</h3>

                    <div class="flex justify-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <strong th:text="'LKR ' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">LKR 0.00</strong>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-secondary">Shipping</span>
                        <strong class="text-success">FREE</strong>
                    </div>
                    <div class="flex justify-between mb-3">
                        <span class="text-secondary">Tax (10%)</span>
                        <strong th:text="'LKR ' + ${#numbers.formatDecimal(totalAmount * 0.1, 1, 2)}">LKR 0.00</strong>
                    </div>
                    <div class="flex justify-between items-center mb-5 pt-3 border-top">
                        <span class="text-lg font-bold">Total</span>
                        <span class="text-3xl font-black text-indigo" th:text="'LKR ' + ${#numbers.formatDecimal(totalAmount + (totalAmount * 0.1), 1, 2)}">LKR 0.00</span>
                    </div>

                    <a th:href="@{/checkout}" class="btn btn-accent btn-lg w-full mb-3" style="width: 100%;">
                        <i class="fas fa-shield-alt"></i> Checkout Securely
                    </a>
                    <a th:href="@{/books(category='fiction')}" class="btn btn-outline w-full mb-3" style="width: 100%;">
                        <i class="fas fa-book-open"></i> Browse Fiction
                    </a>

                    <form th:action="@{/cart/clear}" method="post">
                        <button type="submit" class="btn btn-ghost text-error w-full" style="width: 100%;"
                            onclick="return confirm('Remove all items from cart?')">
                            <i class="fas fa-trash-alt"></i> Clear Cart
                        </button>
                    </form>
                </aside>
            </div>
        </div>
    </main>
</body>

</html>
