<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Contact Us - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            .contact-shell {
                max-width: 1200px;
                margin: var(--space-6) auto var(--space-10);
            }

            .contact-hero {
                padding: clamp(1.5rem, 3vw, 2.5rem);
                border-radius: 28px;
                background: linear-gradient(135deg, rgba(79, 70, 229, 0.94), rgba(37, 99, 235, 0.88));
                color: #fff;
                box-shadow: 0 20px 45px rgba(79, 70, 229, 0.22);
                margin-bottom: 1.5rem;
            }

            [data-theme="dark"] .contact-hero {
                background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(30, 58, 138, 0.9));
            }

            .contact-grid {
                display: grid;
                grid-template-columns: 1.15fr 0.85fr;
                gap: 1rem;
            }

            .glass-card {
                background: color-mix(in srgb, var(--bg-white) 90%, transparent);
                border: 1px solid rgba(99, 102, 241, 0.16);
                border-radius: 24px;
                box-shadow: 0 16px 35px rgba(15, 23, 42, 0.09);
                padding: 1.25rem;
            }

            .contact-info-list {
                display: grid;
                gap: 0.75rem;
            }

            .contact-pill {
                padding: 0.8rem 0.95rem;
                border-radius: 14px;
                background: rgba(99, 102, 241, 0.08);
                color: var(--text-secondary);
                display: flex;
                gap: 0.6rem;
                align-items: flex-start;
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }

            .contact-form input,
            .contact-form textarea {
                width: 100%;
                border-radius: 12px;
                border: 1px solid var(--input-border);
                background: var(--input-bg);
                color: var(--input-text);
                padding: 0.78rem 0.85rem;
                font: inherit;
            }

            .contact-form textarea {
                min-height: 160px;
                resize: vertical;
            }

            @media (max-width: 980px) {
                .contact-grid {
                    grid-template-columns: 1fr;
                }

                .form-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <div class="container contact-shell">
            <section class="contact-hero">
                <h1 th:text="${contactContent.title}">Contact Us</h1>
                <p th:text="${contactContent.subtitle}">Questions, bulk orders, or support requests.</p>
            </section>

            <div th:if="${param.success}" class="alert alert-success mb-4">
                <i class="alert-icon fas fa-check-circle"></i>
                <div class="alert-content">
                    <div class="alert-title">Message Sent</div>
                    <div class="alert-message">Thanks, your message has been received.</div>
                </div>
            </div>

            <section class="contact-grid">
                <article class="glass-card">
                    <h2 class="mb-3">Send A Message</h2>
                    <form th:action="@{/contact/send}" method="post" class="contact-form">
                        <div class="form-grid mb-3">
                            <input type="text" name="name" placeholder="Your name" required>
                            <input type="email" name="email" placeholder="Email address" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" name="subject" placeholder="Subject" required>
                        </div>
                        <div class="mb-3">
                            <textarea name="message" placeholder="How can we help you?" required></textarea>
                        </div>
                        <button class="btn btn-accent" type="submit">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </article>

                <aside class="glass-card">
                    <h2 class="mb-3">Reach Us Directly</h2>
                    <div class="contact-info-list mb-4">
                        <div class="contact-pill" th:each="line : ${#strings.arraySplit(contactContent.content != null ? contactContent.content : '', '\n')}">
                            <i class="fas fa-circle-info"></i>
                            <span th:text="${line}">Email: support@alariis.com</span>
                        </div>
                    </div>

                    <div class="contact-pill mb-4" th:if="${contactContent.extraContent != null && !contactContent.extraContent.isBlank()}">
                        <i class="fas fa-clock"></i>
                        <span th:text="${contactContent.extraContent}">Support hours</span>
                    </div>

                    <a th:href="${contactContent.ctaUrl != null && !contactContent.ctaUrl.isBlank() ? contactContent.ctaUrl : '/books?category=fiction'}"
                        class="btn btn-primary w-full" style="width: 100%;">
                        <i class="fas fa-book-open"></i>
                        <span th:text="${contactContent.ctaText != null && !contactContent.ctaText.isBlank() ? contactContent.ctaText : 'Browse Fiction'}">Browse Fiction</span>
                    </a>
                </aside>
            </section>
        </div>
    </main>
</body>

</html>
